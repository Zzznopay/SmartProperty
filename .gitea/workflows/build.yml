name: Build
on:
  push:
    branches: [ 'main' ]
    tags: [ 'v*' ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with Maven
        run: mvn -B package -DskipTests
      - name: Upload artifact to Suiren
        run: |
          # act 里 GITHUB_REF_NAME 为短名（main 或 tag 名）；兜底防空值
          VERSION="${GITHUB_REF_NAME##*/}"
          VERSION="${VERSION:-unknown}"
          FILE=$(find . -maxdepth 3 -path "*/target/*.jar" -type f | head -n 1)
          if [ -z "$FILE" ]; then echo "no artifact file found (check the artifact glob)" >&2; exit 1; fi
          curl -sS --fail-with-body -X POST "$SUIREN_URL/api/v1/artifacts/upload" \
            -H "Authorization: Bearer $SUIREN_TOKEN" \
            -F "applicationId=4" \
            -F "version=$VERSION-SNAPSHOT" \
            -F "type=JAR" \
            -F "name=smart-property" \
            -F "externalRunId=$GITHUB_RUN_ID" \
            -F "file=@$FILE"
        env:
          # 如需变更，在此直接修改为 Suiren 服务可达地址
          SUIREN_URL: http://host.docker.internal:8080
          SUIREN_TOKEN: ${{ secrets.SUIREN_TOKEN }}
