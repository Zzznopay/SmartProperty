# SmartProperty 中间件（MySQL / Redis / Nacos / RabbitMQ / MinIO）
# 在 deploy 目录下执行:
#   启动: docker compose -f docker-compose.middleware.yml up -d
#   停止: docker compose -f docker-compose.middleware.yml down
#   清数据重启: docker compose -f docker-compose.middleware.yml down -v && docker compose -f docker-compose.middleware.yml up -d
# 说明: 使用 --env-file ../.env 或先将 .env 复制到 deploy/ 目录

name: smart-property-middleware

services:
  mysql:
    image: mysql:latest
    container_name: sp-mysql
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      MYSQL_DATABASE: smart_property_system
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # default-authentication-plugin 在 MySQL 8.4 已移除，9.x 传入会导致启动失败
      - --max-connections=512
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-123456}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [smart-net]

  redis:
    image: redis:latest
    container_name: sp-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-123456}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD:-123456}' --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [smart-net]

  nacos:
    # 使用 latest（当前跟随 v3.x）；v3 镜像 tag 无 -standalone 后缀，MODE=standalone 即单机模式
    image: nacos/nacos-server:latest
    container_name: sp-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
      TZ: ${TZ:-Asia/Shanghai}
      # v3 默认开启鉴权，以下三项必填（token 为 Base64，原文至少 32 字符）
      NACOS_AUTH_TOKEN: ${NACOS_AUTH_TOKEN:-VGhpc0lzTXlDdXN0b21TZWNyZXRLZXkwMTIzNDU2Nzg=}
      NACOS_AUTH_IDENTITY_KEY: ${NACOS_AUTH_IDENTITY_KEY:-serverIdentity}
      NACOS_AUTH_IDENTITY_VALUE: ${NACOS_AUTH_IDENTITY_VALUE:-security}
    ports:
      - "8080:8080"   # v3 控制台（独立端口）
      - "8848:8848"   # 主服务 OpenAPI
      - "9848:9848"   # gRPC
    volumes:
      - nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v3/admin/core/state/readiness >/dev/null && curl -fs http://localhost:8080/v3/console/health/readiness >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks: [smart-net]

  rabbitmq:
    # management 变体 = 最新版本且自带管理控制台（rabbitmq:latest 不含 15672 管理界面）
    image: rabbitmq:management
    container_name: sp-rabbitmq
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-rabbitmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-123456}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks: [smart-net]

  minio:
    image: minio/minio:latest
    container_name: sp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      # MinIO 密钥最少 8 位，123456 仅 6 位会导致容器启动失败
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-12345678}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [smart-net]

networks:
  smart-net:
    name: smart-net
    driver: bridge

volumes:
  mysql-data:
  redis-data:
  nacos-data:
  rabbitmq-data:
  minio-data:
