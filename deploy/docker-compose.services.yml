# SmartProperty 业务服务（Gateway / System / Property / Operation）
# 前置条件: 先启动中间件
#   docker compose -f docker-compose.middleware.yml up -d
# 再在 deploy 目录下启动业务服务:
#   docker compose -f docker-compose.services.yml --env-file ../.env up -d --build
# 停止: docker compose -f docker-compose.services.yml --env-file ../.env down

name: smart-property-services

services:
  gateway:
    build:
      context: ..
      dockerfile: smart-property-gateway/Dockerfile
    container_name: sp-gateway
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    env_file: ../.env
    ports:
      - "8000:8000"
    networks: [smart-net]

  system:
    build:
      context: ..
      dockerfile: smart-property-system/Dockerfile
    container_name: sp-system
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: ../.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_SYSTEM:-smart_property_system}
    ports:
      - "8001:8001"
    networks: [smart-net]

  property:
    build:
      context: ..
      dockerfile: smart-property-property/Dockerfile
    container_name: sp-property
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    env_file: ../.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_PROPERTY:-smart_property_property}
    ports:
      - "8002:8002"
    networks: [smart-net]

  operation:
    build:
      context: ..
      dockerfile: smart-property-operation/Dockerfile
    container_name: sp-operation
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      nacos:
        condition: service_healthy
    env_file: ../.env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE_OPERATION:-smart_property_operation}
    ports:
      - "8003:8003"
    networks: [smart-net]

# depends_on 引用的是 middleware compose 中的服务。
# 跨文件 depends_on 要求两个文件同时加载，因此启动业务服务推荐使用:
#   docker compose -f docker-compose.middleware.yml -f docker-compose.services.yml --env-file ../.env up -d gateway system property operation
# 单独使用本文件启动时，请确保中间件已 healthy，并删除各服务的 depends_on 段。

networks:
  smart-net:
    name: smart-net
    external: true
